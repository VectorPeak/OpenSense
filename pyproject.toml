[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensense"
version = "0.1.0"
description = "Daily PR opportunity finder for known open-source repositories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
opensense = "opensense.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
